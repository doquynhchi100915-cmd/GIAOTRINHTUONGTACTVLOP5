<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rạp Chiếu Phim Nhí</title>
<style>
/* Bố cục: thanh rạp phim đỏ phía trên, thẻ trắng ở giữa, bắp rang Bắp dẫn đường; 2 phòng chiếu mở lần lượt */
:root{--red:#d62839;--redD:#9d0208;--gold:#ffb703;--goldL:#fff1c1;--teal:#1b9aaa;--tealD:#0f6b78;--cream:#fff6e5;--ink:#2b2d42;--soft:#f6ead2;--green:#2fbf71;--orange:#f77f00;--card:#fff;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:linear-gradient(#ffe8d6,var(--cream) 40%,#e3f4f4);background-attachment:fixed;font-size:17px;line-height:1.5}
button,input,textarea{font:inherit;color:inherit}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:10px;align-items:center;padding:8px 16px;background:linear-gradient(#e63946,var(--redD));box-shadow:0 3px 10px #0003;border-bottom:4px solid var(--gold)}
.logo{font-weight:900;color:#fff;white-space:nowrap;font-size:18px;letter-spacing:.02em}
.bar{flex:1;min-width:60px;height:16px;border-radius:99px;background:#ffffff40;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe066,var(--gold));transition:width .5s;border-radius:99px}
.ib{width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#fff;cursor:pointer;font-size:21px;box-shadow:0 3px 0 #0003;flex:none}
.ib:active{transform:translateY(2px)}.ib.off{opacity:.5}
main{max-width:1000px;margin:0 auto;padding:14px 16px 40px}
.card{background:var(--card);border-radius:24px;box-shadow:0 8px 0 #0000000d,0 18px 40px #9d020826;border:4px solid #fff;padding:18px}
.btn{font-weight:900;font-size:18px;min-height:52px;padding:10px 24px;border:0;border-radius:18px;cursor:pointer;color:#fff;background:linear-gradient(#ff5c6c,var(--red));box-shadow:0 6px 0 var(--redD);transition:transform .08s,box-shadow .08s}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 2px 0 var(--redD)}
.btn.g{background:linear-gradient(#5be39a,var(--green));box-shadow:0 6px 0 #1c8a52}.btn.g:active:not([disabled]){box-shadow:0 2px 0 #1c8a52}
.btn.t{background:linear-gradient(#3ec6d6,var(--teal));box-shadow:0 6px 0 var(--tealD)}.btn.t:active:not([disabled]){box-shadow:0 2px 0 var(--tealD)}
.btn.o{background:linear-gradient(#ffd166,var(--gold));color:#5a3a00;box-shadow:0 6px 0 #c98600}.btn.o:active:not([disabled]){box-shadow:0 2px 0 #c98600}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 6px 0 #d9cdb5;border:2px solid #efe3c8}.btn.w:active:not([disabled]){box-shadow:0 2px 0 #d9cdb5}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.big{font-size:24px;min-height:64px;padding:12px 34px}.btn.sm{min-height:44px;font-size:16px;padding:6px 16px}
:focus-visible{outline:4px solid #6d28d9;outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.row.c{justify-content:center}
.guide{display:flex;gap:12px;align-items:center}.guide .mascot{flex:none}
.bub{position:relative;background:#fff8d6;border:3px solid var(--gold);border-radius:20px;padding:10px 16px;font-weight:700;font-size:18px;min-width:0;flex:1}
.bub::before{content:"";position:absolute;left:-12px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--gold);border-left:0}
.bub.big{font-size:clamp(18px,2.6vw,24px)}
.mascot{animation:nhun 2.6s ease-in-out infinite;filter:drop-shadow(0 8px 6px #0002)}
@keyframes nhun{50%{transform:translateY(-8px)}}
.blink{animation:chop 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes chop{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes lac{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.lac{animation:lac .35s}
.chao{text-align:center;position:relative;overflow:hidden}
.chao h1{font-size:clamp(28px,5.4vw,50px);line-height:1.08;margin:6px 0 2px;color:var(--red);text-wrap:balance}
.marq{display:flex;justify-content:center;gap:8px;margin:6px 0;font-size:22px}.marq span{animation:nhap 1.4s infinite}.marq span:nth-child(2n){animation-delay:.7s}
@keyframes nhap{50%{opacity:.25}}
.name{font-size:22px;font-weight:800;text-align:center;border:4px solid var(--gold);border-radius:16px;padding:10px 14px;width:min(360px,100%);background:#fffdf0}
.hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tag{display:inline-block;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--redD);border-radius:99px;padding:1px 12px}
.hd h2{margin:0;font-size:clamp(19px,3.2vw,26px);flex:1;min-width:200px}
.steps{display:flex;gap:6px}.steps i{width:14px;height:14px;border-radius:50%;background:#e8dcc3}.steps i.on{background:var(--green)}.steps i.now{background:var(--orange);transform:scale(1.35)}
.stageBody{margin:14px 0}
.map{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:14px 0}
@media(max-width:700px){.map{grid-template-columns:1fr}}
.room{position:relative;text-align:left;border-radius:22px;padding:18px 18px 18px 26px;background:linear-gradient(#fff,#fff6e5);border:4px solid var(--c);box-shadow:0 8px 0 var(--c2),0 14px 24px #0001;cursor:pointer;display:flex;gap:14px;align-items:center;min-width:0}
.room::before,.room::after{content:"";position:absolute;left:-12px;width:22px;height:22px;border-radius:50%;background:var(--cream);border:4px solid var(--c)}
.room::before{top:18px}.room::after{bottom:18px}
.room:hover:not(.lock){transform:translateY(-4px)}
.room.lock{filter:grayscale(.9);opacity:.6;cursor:not-allowed}
.room .ico{flex:none;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:radial-gradient(circle at 32% 28%,#fff,var(--c));box-shadow:0 6px 0 var(--c2)}
.room h3{margin:2px 0;font-size:20px;line-height:1.2}.room p{margin:0;font-size:15px;color:#6b6475;font-weight:600}
.room .st{position:absolute;right:12px;top:8px;font-size:26px}
.def{font-size:clamp(18px,2.4vw,22px);font-weight:700;margin:8px 0}
.q{font-size:clamp(19px,2.8vw,26px);font-weight:900;margin:6px 0 10px}
.qn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;margin-right:8px;font-size:18px}
.fb{margin-top:12px;border-radius:16px;padding:10px 14px;font-weight:800;display:none}
.fb.show{display:block;animation:pop .35s}.fb.ok{background:#e1f8ea;border:3px solid var(--green)}.fb.no{background:#fff1e0;border:3px solid var(--orange)}.fb.in{background:#e6f6f8;border:3px solid var(--teal)}
details.xem{margin:8px 0;background:var(--soft);border-radius:14px;padding:6px 12px}details.xem summary{cursor:pointer;font-weight:800;min-height:36px;display:flex;align-items:center}
/* tờ quảng cáo */
.poster{background:#fffdf3;border:3px solid #cde8b0;border-radius:18px;padding:0 0 12px;box-shadow:3px 4px 0 #0001;overflow:hidden;font-size:17px}
.pBanner{background:linear-gradient(#8fd16a,#6cbf4a);color:#fff;font-weight:900;font-size:clamp(17px,2.8vw,26px);padding:12px 16px;letter-spacing:.02em;transform-origin:left;transform:rotate(-1.2deg);margin:6px -8px 6px;text-shadow:0 2px 0 #3a7d1e}
.pBody{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:8px;align-items:center;padding:4px 16px}
@media(max-width:600px){.pBody{grid-template-columns:1fr}}
.pImg{overflow:hidden;border-radius:18px;width:min(210px,100%);height:225px;margin:0 auto}.pImg img{height:225px;width:auto;max-width:none;display:block}
.pTxt p{margin:4px 0}.pTitle{font-size:clamp(28px,5.4vw,46px);font-weight:900;color:var(--orange);margin:2px 0;line-height:1;text-shadow:2px 2px 0 #ffd9a8}
.pH{margin:10px 16px 2px;color:var(--tealD);font-size:18px}.poster>p{margin:2px 16px}
.pEnd{color:var(--red);font-weight:900;text-align:center;margin:10px 16px 0!important}
.pk{border-radius:8px;cursor:pointer;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone;transition:background .15s}
.pk:hover{background:#fff1a8}.pk.sel{background:#ffe066;outline:3px solid var(--gold)}.pk.good{background:#c8f3d6;outline:3px solid var(--green)}.pk.bad{background:#ffe0cc;outline:3px dashed var(--orange)}
.vc{border-bottom:3px dotted var(--teal);cursor:help;font-weight:900}
.gl{background:#e6f6f8;border:3px solid var(--teal);border-radius:14px;padding:8px 12px;margin-top:8px;font-weight:700;display:none}.gl.show{display:block;animation:pop .3s}
/* ghép, phân loại */
.mt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
@media(max-width:640px){.mt{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:10px}
.lab,.chip,.cardx{min-height:56px;padding:10px 14px;border-radius:16px;border:4px solid #d9cdb5;background:#fff;font-weight:800;text-align:left;cursor:pointer;box-shadow:0 4px 0 #d9cdb5;font-size:17px}
.lab{background:#e6f6f8;border-color:var(--teal);box-shadow:0 4px 0 var(--tealD)}
.lab.sel,.chip.sel,.cardx.sel{outline:4px solid var(--gold);transform:scale(1.02)}
.lab.ok,.chip.ok{background:#e1f8ea;border-color:var(--green);box-shadow:none;cursor:default}
.chip:disabled,.lab:disabled{cursor:default}
.buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
@media(max-width:700px){.buckets{grid-template-columns:1fr}}
.bk{min-height:110px;border:4px dashed var(--c);border-radius:18px;padding:8px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.bk h4{margin:0;color:var(--c);font-size:16px}.bk.hov{background:#fffbe0}
.pool{display:flex;flex-wrap:wrap;gap:10px}.pool .cardx{flex:1 1 220px}
.bk .cardx{min-height:40px;font-size:15px;padding:6px 10px;background:#e1f8ea;border-color:var(--green);box-shadow:none;cursor:default}
.mc{display:flex;flex-direction:column;gap:10px}
.mc .cardx.on{background:#e6f6f8;border-color:var(--teal)}.mc .cardx.good{background:#e1f8ea;border-color:var(--green)}.mc .cardx.bad{background:#fff1e0;border-color:var(--orange)}
/* Em Thuý, kết từ */
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.pic{border-radius:16px;overflow:hidden;border:4px solid #fff;box-shadow:0 6px 14px #0003;background:#fff}.pic img{display:block;width:100%;height:auto}
.cap{font-style:italic;color:var(--tealD);font-weight:700;text-align:center;margin:4px 0}
.txt{background:#fff8d6;border:3px solid var(--gold);border-radius:16px;padding:12px 16px;font-size:clamp(17px,2.2vw,20px)}
.kt{font-weight:900;color:var(--red);cursor:pointer;border-bottom:3px solid var(--red);padding:0 2px}.kt.hid{color:transparent;border-bottom:3px dashed #b9a98d;background:#f1e7d0;border-radius:6px;user-select:none}
.tgl{display:flex;align-items:center;gap:8px;font-weight:800;margin:8px 0;cursor:pointer;min-height:44px}.tgl input{width:24px;height:24px;accent-color:var(--red)}
.gn{background:#fff8d6;border:3px solid var(--gold);border-radius:16px;padding:12px 16px;font-size:clamp(17px,2.3vw,21px);font-weight:700}
.gn li{margin:6px 0}.gn .kk{font-weight:900;color:var(--red);font-style:italic}
.cards{display:flex;flex-direction:column;gap:12px}
.it{border:3px solid #efe3c8;border-radius:18px;padding:12px 14px;background:#fffdf7}.it.done{border-color:var(--green);background:#f2fcf6}
.it .lbl{font-weight:900;color:var(--teal);margin-right:6px}
.sent{font-size:clamp(17px,2.3vw,21px);font-weight:700}
.tk{display:inline-block;margin:2px;padding:3px 8px;border-radius:10px;border:3px solid transparent;background:none;cursor:pointer;font-weight:700;min-height:40px}
.tk:hover{background:#fff1a8}.tk.sel{background:#ffe066;border-color:var(--gold)}.tk.ok{background:#c8f3d6;border-color:var(--green);color:var(--ink)}
.blank{display:inline-block;min-width:56px;border-bottom:4px solid var(--gold);text-align:center;color:var(--red);font-weight:900;margin:0 3px}
.opts{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.opts .chip{min-height:48px;box-shadow:0 4px 0 #d9cdb5}
.chip.bad{background:#fff1e0;border-color:var(--orange);opacity:.6}
.pics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.pics{grid-template-columns:1fr}}
.pc{border:4px solid #efe3c8;border-radius:16px;padding:6px;background:#fff;cursor:pointer;text-align:center;font-size:14px;font-weight:700}
.pc img{width:100%;height:110px;object-fit:cover;border-radius:10px;display:block}.pc.sel{border-color:var(--red);box-shadow:0 0 0 3px #d6283933}
textarea{width:100%;min-height:120px;border:4px solid var(--teal);border-radius:16px;padding:10px 12px;font-size:19px;font-weight:600;resize:vertical}
.kti{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.kti button{min-height:40px;padding:4px 12px;border-radius:12px;border:3px solid var(--gold);background:#fff8d6;font-weight:800;cursor:pointer}
.hl{background:#ffe066;border-radius:6px;padding:0 3px;font-weight:900}
.tick{text-align:center}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:16px;padding-top:14px;border-top:3px dotted #e8dcc3}
.nav .l,.nav .r{display:flex;gap:10px;flex-wrap:wrap}
.cert{border:10px double var(--gold);border-radius:20px;background:radial-gradient(circle at 50% 0,#fffdf0,#fff1c1);padding:18px;text-align:center;margin:12px 0}
.cert h2{margin:0;font-size:clamp(26px,5vw,44px);color:var(--red);letter-spacing:.08em}
.cert .nm{font-size:clamp(30px,6vw,52px);font-weight:900;color:var(--teal);border-bottom:3px dotted var(--gold);display:inline-block;padding:0 20px;margin:6px 0;word-break:break-word}
.tks{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px 0}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media(max-width:560px){.logo{display:none}.ib{width:40px;height:40px;font-size:18px}#top{gap:8px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style></head><body>
<div id="top"><span class="logo">🎬 Rạp Chiếu Phim Nhí</span><div class="bar" aria-label="Tiến trình"><i id="pg"></i></div><button class="ib" id="bHome" title="Về rạp phim" aria-label="Về rạp phim">🎟️</button><button class="ib" id="bSnd" title="Bật/tắt âm thanh" aria-label="Âm thanh">🔊</button><button class="ib" id="bVoi" title="Bật/tắt giọng đọc" aria-label="Giọng đọc">🗣️</button></div>
<main id="sk"></main>
<canvas id="cf"></canvas>

<script>
"use strict";
const $=s=>document.querySelector(s);
const REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;
/* ============ ÂM THANH ============ */
const Snd=(()=>{let ctx=null,on=true;
  const A=()=>{if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==="suspended")ctx.resume();return ctx};
  function tone(f,t,d,ty="sine",v=.12){if(!on)return;try{const c=A(),s=c.currentTime+t,o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.015);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g);g.connect(c.destination);o.start(s);o.stop(s+d+.05)}catch(e){}}
  return{set(v){on=v;if(v)try{A()}catch(e){}},get on(){return on},
    click(){tone(700,0,.07,"triangle",.08)},tick(){tone(900+Math.random()*250,0,.05,"square",.03)},
    ok(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.28,"triangle",.14))},
    bad(){tone(320,0,.18,"sine",.09);tone(270,.13,.28,"sine",.08)},
    pop(){tone(500,0,.08,"sine",.1);tone(750,.05,.1,"sine",.08)},
    badge(){[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,i*.12,.4,"triangle",.15));[262,392].forEach(f=>tone(f,.2,1.2,"sine",.07))}};
})();
const Voice={on:true,say(t){if(!this.on||!("speechSynthesis" in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="vi-VN";u.rate=.95;const v=speechSynthesis.getVoices().find(x=>/^vi/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}},stop(){try{speechSynthesis.cancel()}catch(e){}}};
/* ============ PHÁO GIẤY & SAO ============ */
const cf=$("#cf"),cx=cf.getContext("2d");let parts=[],raf2=0;
function fit(){cf.width=innerWidth;cf.height=innerHeight}addEventListener("resize",fit);fit();
function boom(n=110,x=innerWidth/2,y=innerHeight*.4){if(REDUCE)n=24;const C=["#ffd23f","#ff6fa5","#4db8ff","#2fbf71","#ff9f43","#a78bfa"];
  for(let i=0;i<n;i++){const g=Math.random()*Math.PI*2,v=4+Math.random()*9;parts.push({x,y,vx:Math.cos(g)*v,vy:Math.sin(g)*v-5,r:6+Math.random()*7,rot:Math.random()*6,vr:(Math.random()-.5)*.4,c:C[i%C.length],star:i%4===0,l:0,L:90+Math.random()*50})}
  if(!raf2)loop()}
function star(c,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;c.lineTo(Math.cos(a)*q,Math.sin(a)*q)}c.closePath();c.fill()}

      else{u.w++;Snd.bad();c.classList.add("lac");later(()=>c.classList.remove("lac"),400);fb(f,"no",`${VIEN[0]} 💡 Em tìm lại thông tin này trong tờ quảng cáo nhé.`)}});

  return{html:`<div class="q"><span class="qn">3</span>Theo em, những từ ngữ nào trong tờ quảng cáo có tác dụng gây ấn tượng, thu hút khán giả?</div><p style="margin:0 0 8px;font-weight:700">Bấm vào ít nhất 3 từ ngữ hoặc câu em thấy ấn tượng, rồi bấm Kiểm tra.</p>${posterHtml("pick")}<div class="fb" id="fb"></div><p class="row"><button class="btn t" id="ck" ${u.done?"disabled":""}>Kiểm tra</button><button class="btn w sm" id="xd" ${u.done?"disabled":""}>Xem gợi ý</button></p>`,

  const T=`<i>Em Thuý</i> là bức tranh sơn dầu <b class="kt" data-i="0">do</b> hoạ sĩ Trần Văn Cẩn sáng tác <b class="kt" data-i="1">vào</b> năm 1943. Bức tranh vẽ một bé gái 8 tuổi, có mái tóc ngắn, đôi mắt mở to, trong sáng <b class="kt" data-i="2">và</b> nét mặt thơ ngây. Bức tranh được coi là một <b class="kt" data-i="3">trong</b> những tác phẩm xuất sắc nhất <b class="kt" data-i="4">của</b> tranh chân dung Việt Nam thế kỉ XX.`;
  return{html:`<div class="q"><span class="qn">1</span>Các từ in đậm dưới đây được dùng để làm gì?</div><div class="two"><div><div class="txt" id="txt">${T}</div><p style="text-align:right;margin:2px 0;font-style:italic">(Hà Phan)</p><label class="tgl"><input type="checkbox" id="an"> Ẩn các từ in đậm để xem câu văn thay đổi thế nào</label><div class="gl" id="gl"></div></div><div><div class="pic"><img src="${IMG.thuy}" alt="Bức tranh Em Thuý"></div><div class="cap">Em Thuý</div></div></div>
  <p style="font-weight:800;margin:12px 0 6px">Theo em, các từ in đậm dùng để làm gì?</p><div class="mc" id="mc">${ord.map(i=>`<button class="cardx" data-i="${i}">${O[i]}</button>`).join("")}</div><div class="fb" id="fb"></div>`,
  init(){const f=$("#fb");main.querySelectorAll(".kt").forEach(t=>t.onclick=()=>{const g=$("#gl");g.innerHTML=`Từ <b>“${KT[+t.dataset.i][0]}”</b> ${KT[+t.dataset.i][1]}.`;g.classList.remove("show");void g.offsetWidth;g.classList.add("show");Snd.pop()});
    $("#an").onchange=e=>main.querySelectorAll(".kt").forEach(t=>t.classList.toggle("hid",e.target.checked));
    const cs=[...main.querySelectorAll("#mc .cardx")];const fin=()=>cs.forEach(c=>{c.disabled=true;if(+c.dataset.i===0)c.classList.add("good")});
    cs.forEach(c=>c.onclick=()=>{if(u.done)return;Snd.click();if(+c.dataset.i===0){c.classList.add("good");fin();Snd.ok();boom(100);fb(f,"ok",`⭐ ${khen()} Các từ in đậm là kết từ, dùng để nối các từ ngữ trong câu và thể hiện mối quan hệ giữa chúng.`);resolve(k,true)}else{u.w++;Snd.bad();c.classList.add("bad");c.disabled=true;fb(f,"no",`${VIEN[0]} 💡 Em bấm vào từng từ in đậm và đọc xem nó nối những từ ngữ nào nhé.`)}});
    if(u.done){fin();fb(f,"ok","Các từ in đậm là kết từ, dùng để nối các từ ngữ trong câu và thể hiện mối quan hệ giữa chúng.")}}}}
/* ---- ghi nhớ ---- */
function bGn(){return{html:`<div class="gn"><div style="font-weight:900;font-size:1.15em;margin-bottom:4px">📎 Ghi nhớ</div><ul style="margin:0;padding-left:20px"><li>Kết từ là từ nối các từ ngữ hoặc các câu, nhằm thể hiện mối quan hệ giữa các từ ngữ hoặc các câu với nhau như: <span class="kk">và, với, hay, hoặc, vì, do, của,…</span></li><li>Có những kết từ dùng theo cặp (cặp kết từ) như: <span class="kk">mặc dù… nhưng, vì… nên, nếu… thì, không những… mà còn,…</span></li></ul></div><div class="row" style="margin-top:12px"><button class="btn t sm" id="doc">🔊 Nghe đọc</button></div>`,init(){$("#doc").onclick=()=>Voice.say("Ghi nhớ. Kết từ là từ nối các từ ngữ hoặc các câu, nhằm thể hiện mối quan hệ giữa các từ ngữ hoặc các câu với nhau như: và, với, hay, hoặc, vì, do, của. Có những kết từ dùng theo cặp, như: mặc dù nhưng, vì nên, nếu thì, không những mà còn.")}}}
/* ---- bài 2: cặp kết từ ---- */
const E2=[["e2a","a","Vì những bức tranh của Bùi Xuân Phái mang hồn cốt của phố cổ Hà Nội nên tranh của ông được gọi là “Phố Phái”.",["vì","nên"]],["e2b","b","Mặc dù phim hoạt hình thường hướng tới đối tượng trẻ em, nhưng nhiều người lớn vẫn rất yêu thích loại phim này.",["mặc","dù","nhưng"]],["e2c","c","Dân ca quan họ không những là niềm tự hào của người dân Kinh Bắc mà còn là niềm tự hào của cả dân tộc Việt Nam.",["không","những","mà","còn"]],["e2d","d","Nếu bạn thực sự yêu thích ba lê thì bạn nên theo học từ khi còn nhỏ.",["nếu","thì"]]];
const norm=t=>t.replace(/[“”",.:;!?]/g,"").toLowerCase();
function bE2(){return{html:`<div class="q"><span class="qn">2</span>Chỉ ra các từ nối được dùng thành cặp trong những câu dưới đây.</div><p style="margin:0 0 8px;font-weight:700">Bấm vào các từ tạo thành cặp kết từ, rồi bấm Kiểm tra.</p><div class="cards">${E2.map(e=>`<div class="it" id="it-${e[0]}"><div class="sent"><span class="lbl">${e[1]}.</span><span class="toks">${e[2].split(/\s+/).map((t,i)=>`<button class="tk" data-i="${i}">${t}</button>`).join("")}</span></div><div class="fb" id="fb-${e[0]}"></div><div class="row" style="margin-top:6px"><button class="btn t sm ck">Kiểm tra</button><button class="btn w sm xd">Xem đáp án</button></div></div>`).join("")}</div>`,
  init(){E2.forEach(e=>{const [k,,s,ex]=e,u=U(k),box=$("#it-"+k),f=$("#fb-"+k),toks=s.split(/\s+/),tk=[...box.querySelectorAll(".tk")];
    let prev=-1;const want=ex.map(w=>{let i=toks.findIndex((t,j)=>j>prev&&norm(t)===w);prev=i;return i});
    const fin=()=>{tk.forEach((b,i)=>{b.disabled=true;b.classList.remove("sel");if(want.includes(i))b.classList.add("ok")});box.classList.add("done");box.querySelectorAll(".btn").forEach(b=>b.disabled=true)};
    tk.forEach(b=>b.onclick=()=>{if(u.done)return;b.classList.toggle("sel");Snd.tick()});
    box.querySelector(".ck").onclick=()=>{const ch=tk.map((b,i)=>b.classList.contains("sel")?i:-1).filter(i=>i>=0);if(!ch.length){fb(f,"in","👆 Em bấm vào các từ trong câu nhé.");return}
      const same=ch.length===want.length&&ch.every(i=>want.includes(i));if(same){fin();Snd.ok();boom(60,innerWidth/2,innerHeight*.5);fb(f,"ok",`⭐ ${khen()} Cặp kết từ: ${ex.length===2?ex.join(" … "):k==="e2b"?"mặc dù … nhưng":"không những … mà còn"}`);resolve(k,true)}
      else{u.w++;Snd.bad();fb(f,"no",`${VIEN[0]} 💡 Cặp kết từ gồm hai từ (hoặc cụm từ) đi cùng nhau, mỗi từ đứng ở một vế câu.`)}};
    box.querySelector(".xd").onclick=()=>{fin();fb(f,"in",`Đáp án: ${k==="e2a"?"vì … nên":k==="e2b"?"mặc dù … nhưng":k==="e2c"?"không những … mà còn":"nếu … thì"}`);resolve(k,false,true)};
    if(u.done)fin()})}}}
/* ---- bài 3: điền kết từ ---- */
const E3=[["e3a","a","Cậu thích xem phim hài {0} phim hành động?",["hay"],["hay","của","trong"]],["e3b","b","Tranh Đông Hồ giản dị {0} tinh tế.",["mà"],["mà","của","trong"]],["e3c","c","{0} bạn muốn chơi pi-a-nô thành thạo {1} bạn phải kiên trì.",["Nếu","thì"],["Nếu … thì","Vì … nên","Mặc dù … nhưng"]],["e3d","d","{0} khổ công luyện tập {1} Lê-ô-nác-đô đa Vin-xi đã trở thành một danh hoạ kiệt xuất của thế giới.",["Vì","nên"],["Vì … nên","Mặc dù … nhưng","Nếu … thì"]]];
function bE3(){return{html:`<div class="q"><span class="qn">3</span>Tìm kết từ phù hợp thay cho mỗi bông hoa trong những câu sau.</div><div class="cards">${E3.map(e=>`<div class="it" id="it-${e[0]}"><div class="sent"><span class="lbl">${e[1]}.</span>${e[2].replace(/\{(\d)\}/g,(m,i)=>`<span class="blank" data-i="${i}">🌸</span>`)}</div><div class="opts">${shuf(e[4]).map(o=>`<button class="chip" data-o="${esc(o)}">${o}</button>`).join("")}</div><div class="fb" id="fb-${e[0]}"></div></div>`).join("")}</div>`,
  init(){E3.forEach(e=>{const [k,,,ans,opts]=e,u=U(k),box=$("#it-"+k),f=$("#fb-"+k),chips=[...box.querySelectorAll(".chip")],bl=[...box.querySelectorAll(".blank")];const right=ans.length===2?ans[0]+" … "+ans[1]:ans[0];
    const fill=()=>{bl.forEach((b,i)=>{b.textContent=ans[i];b.style.borderBottomColor="var(--green)"});chips.forEach(c=>{c.disabled=true;if(c.dataset.o===right)c.classList.add("ok")});box.classList.add("done")};
    chips.forEach(c=>c.onclick=()=>{if(u.done)return;Snd.click();if(c.dataset.o===right){fill();Snd.ok();boom(60,innerWidth/2,innerHeight*.5);fb(f,"ok",`⭐ ${khen()}`);resolve(k,true)}else{u.w++;Snd.bad();c.classList.add("bad");c.disabled=true;fb(f,"no",`${VIEN[0]} 💡 Em đọc lại cả câu xem hai vế nói về điều gì, mối quan hệ giữa chúng ra sao.`)}});
    if(u.done)fill()})}}}
/* ---- bài 4: viết câu ---- */
const E4P=[["p1","Tác phẩm điêu khắc Những người tắm biển của Pi-cát-xô","Tác phẩm điêu khắc “Những người tắm biển” của Pi-cát-xô có những hình người đứng cạnh nhau. Hình dáng các nhân vật rất lạ mắt nên em thấy tò mò."],["p2","Một tác phẩm hội hoạ của Bùi Xuân Phái","Tác phẩm hội hoạ của Bùi Xuân Phái vẽ những mái nhà và con phố cũ. Bức tranh giản dị mà gợi nhiều nỗi nhớ."],["p3","Nghệ thuật múa rối nước (Ảnh: Thành Đạt)","Nghệ thuật múa rối nước diễn ra trước ngôi đình nhỏ bên mặt nước. Nếu em có dịp đến xem thì em sẽ rất thích."]];
const KD1=["và","với","hay","hoặc","vì","do","của","nên","nhưng","mà","nếu","thì","tại","bởi","nhờ","trong","vào"];
function bE4(){const k="e4",u=U(k);let cur=0;
  return{html:`<div class="q"><span class="qn">4</span>Viết 2 – 3 câu có kết từ để giới thiệu về một trong những bức tranh, bức ảnh dưới đây.</div><div class="pics">${E4P.map((p,i)=>`<button class="pc ${i===0?"sel":""}" data-i="${i}"><img src="${IMG[p[0]]}" alt="${p[1]}">${p[1]}</button>`).join("")}</div>
  <p style="font-weight:800;margin:12px 0 4px"><label for="vt">Em viết 2 – 3 câu nhé:</label></p><div class="kti" aria-label="Kết từ gợi ý">${["và","với","hay","vì","do","của","nên","nhưng","mà","nếu","thì"].map(w=>`<button data-w="${w}">${w}</button>`).join("")}</div><textarea id="vt" placeholder="Ví dụ: Bức tranh … do hoạ sĩ … vẽ và …" ${u.done?"disabled":""}></textarea><div class="fb" id="fb"></div><p class="row"><button class="btn t" id="ck" ${u.done?"disabled":""}>Kiểm tra</button><button class="btn w sm" id="xd" ${u.done?"disabled":""}>Xem câu mẫu</button></p>`,
  init(){const f=$("#fb"),ta=$("#vt");main.querySelectorAll(".pc").forEach(p=>p.onclick=()=>{cur=+p.dataset.i;main.querySelectorAll(".pc").forEach(x=>x.classList.toggle("sel",x===p));Snd.click()});
    main.querySelectorAll(".kti button").forEach(b=>b.onclick=()=>{if(u.done)return;const w=b.dataset.w;ta.value+=(ta.value&&!/\s$/.test(ta.value)?" ":"")+w+" ";ta.focus();Snd.tick()});
    const analyse=t=>{const sents=t.split(/[.!?…]+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).filter(Boolean).length>=4);const toks=t.split(/\s+/).map(norm);const found=[...new Set(toks.filter(w=>KD1.includes(w)))];const mdnh=/mặc dù/i.test(t)&&/nhưng/i.test(t);const kn=/không những/i.test(t)&&/mà còn/i.test(t);return{sents:sents.length,found,mdnh,kn}};
    const prev=(t,fo)=>esc(t).replace(new RegExp("(^|[\\s“(])("+[...fo,"mặc dù","không những","mà còn"].join("|")+")(?=[\\s,.!?”)]|$)","gi"),(m,a,b)=>`${a}<span class="hl">${b}</span>`);
    $("#ck").onclick=()=>{const t=ta.value.trim();if(!t){fb(f,"in","✍️ Em hãy viết 2 – 3 câu vào ô nhé. Em có thể bấm các kết từ gợi ý!");return}
      const a=analyse(t);if(a.sents<2){u.w++;Snd.bad();fb(f,"no",`Em viết thêm cho đủ 2 – 3 câu nhé (mỗi câu kết thúc bằng dấu chấm). Hiện có ${a.sents} câu.`);return}
      if(!a.found.length&&!a.mdnh&&!a.kn){u.w++;Snd.bad();fb(f,"no","Em chưa dùng kết từ nào. 💡 Hãy thử dùng: và, với, hay, của, vì… nên, nếu… thì… (bấm các nút gợi ý phía trên).");return}
      Snd.ok();boom(110);fb(f,"ok",`⭐ ${khen()} Em đã viết ${a.sents} câu, dùng kết từ: <span class="hl">${[...a.found,...(a.mdnh?["mặc dù … nhưng"]:[]),...(a.kn?["không những … mà còn"]:[])].join(", ")}</span>.${a.sents>3?" Lần sau em thử viết gọn trong 2 – 3 câu nhé.":""}<div style="margin-top:6px;font-weight:700">${prev(t,a.found)}</div>`);ta.disabled=true;resolve(k,true);$("#ck").disabled=true;$("#xd").disabled=true};
    $("#xd").onclick=()=>{fb(f,"in",`Câu mẫu gợi ý: “${E4P[cur][2]}”<br>Em thử viết câu của riêng mình, không nhất thiết giống mẫu nhé.`);Snd.pop();u.xem=true;$("#xd").disabled=true}
    if(u.done)fb(f,"ok","Em đã hoàn thành bài này rồi!")}}}
/* ---- huy hiệu phòng ---- */
function bXong(){const ph=S.ph;const ids=SU.q1?Object.keys(SU).filter(s=>STEPS[ph].includes(s)).flatMap(s=>SU[s]):[];const ok=ids.filter(k=>U(k).ok).length;
  if(!S.xong[ph]){S.xong[ph]=true;prog();later(()=>{Snd.badge();boom(160,innerWidth/2,innerHeight*.35);later(()=>boom(90,innerWidth*.25,innerHeight*.4),500);later(()=>boom(90,innerWidth*.75,innerHeight*.4),900)},300)}
  return{html:`<div class="tick"><div style="margin:0 auto;animation:pop .8s both;width:fit-content">${ticket(ph+1,230)}</div><h3 style="font-size:clamp(22px,3.4vw,30px);margin:6px 0">Em nhận được vé xem phim phòng ${ph+1}!</h3><p style="font-weight:800;margin:4px 0">Em trả lời đúng <b style="color:var(--green)">${ok}/${ids.length}</b> câu hỏi trong phòng này.</p></div>`}}
function showTong(){const ids=ALLU,ok=ids.filter(k=>U(k).ok).length,first=ids.filter(k=>U(k).ok&&U(k).w===0).length;const d=new Date(),ten=S.ten||"Nhà phê bình nhí";
  main.innerHTML=`<div class="card"><div class="guide">${mascot(90)}<div class="bub">Chúc mừng ${esc(S.ten||"em")} đã xem hết các phòng chiếu! Em là một nhà phê bình phim nhí thực thụ!</div></div><div class="tks">${ticket(1,200)}${ticket(2,200)}</div>
  <div class="cert" id="cert"><h2>GIẤY CHỨNG NHẬN</h2><div style="font-weight:800">Chúc mừng em</div><div class="nm">${esc(ten)}</div><p style="font-weight:800;font-size:19px;margin:4px 0">đã hoàn thành bài 29 “Phim hoạt hình Chú ốc sên bay” và phần Luyện từ và câu về Kết từ, Tiếng Việt lớp 5.</p><p style="font-weight:900;font-size:22px;margin:6px 0;color:var(--green)">Số câu đúng: ${ok}/${ids.length} · Đúng ngay lần đầu: ${first}/${ids.length}</p><div style="font-weight:700">Danh hiệu: Nhà phê bình phim nhí · Ngày ${d.getDate()} tháng ${d.getMonth()+1} năm ${d.getFullYear()}</div></div>
  <div class="nav"><div class="l"><button class="btn w" id="t1">🎟️ Về rạp phim</button><button class="btn w" id="t2">🔄 Chơi lại từ đầu</button></div></div></div>`;
  $("#t1").onclick=()=>go("ban");$("#t2").onclick=()=>{S.u={};S.xong=[false,false];go("ban")};
  later(()=>{Snd.badge();boom(180);later(()=>boom(100,innerWidth*.2,innerHeight*.4),600);later(()=>boom(100,innerWidth*.8,innerHeight*.4),1100)},300);Voice.say(`Chúc mừng ${S.ten||"em"}! Em đã trả lời đúng ${ok} trên ${ids.length} câu và nhận đủ hai vé xem phim.`)}
$("#bHome").onclick=()=>{if(S.man!=="chao")go("ban")};
$("#bSnd").onclick=function(){Snd.set(!Snd.on);this.classList.toggle("off",!Snd.on);this.textContent=Snd.on?"🔊":"🔇"};
$("#bVoi").onclick=function(){Voice.on=!Voice.on;this.classList.toggle("off",!Voice.on);if(!Voice.on)Voice.stop()};
render();

</script>
</body></html>
